<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Search Results</title>
<style>
:root{
  --epic-teal:#087e72;
  --epic-border:#c7d3d0;
  --epic-panel:#eef5f3;
  --epic-row:#fbfbfb;
  --epic-selected:#d7eee8;
  --epic-blue:#385d71;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#fff;color:#222;font-size:11px}
.plan-window{height:100vh;min-height:420px;display:flex;flex-direction:column;background:var(--epic-panel);border:1px solid #6ba89f}
.top-tools {
    height: 46px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 7px;
    border-bottom: 1px solid var(--epic-border);
    background: #f5f7f6;
}
.tool-btn {
    height: 37px;
    padding: 0 9px;
    border: 1px solid #bdc9c6;
    background: #f2f4f3;
    color: #44565f;
    font-size: 14px;
    cursor: pointer;
}
.tool-btn:hover{background:white}
.tool-spacer{flex:1}


.search-wrap{
  display:flex;
  align-items:center;
  width:min(520px,62%);
  height:37px;
  border:1px solid #b9c7c4;
  background:white;
}
.search-wrap:focus-within{border-color:#78aadb;box-shadow:0 0 2px rgba(67,130,190,.45)}
#searchBox {
    width: 100%;
    height: 35px;
    border: 0;
    outline: 0;
    padding: 0 7px;
    font-size: 14px;
    background: transparent;
}
/* =========================================================
   SEARCH
   ========================================================= */

.search-icon {
    width: 25px;
    text-align: center;
    color: #416b7c;
    font-size: 14px;
}


/* =========================================================
   FILTER BAR
   ========================================================= */

.filters-bar {
    margin: 5px 7px 3px;
    height: 27px;

    border: 1px solid var(--epic-border);
    background: white;

    display: flex;
    align-items: center;

    padding: 0 8px;

    color: var(--epic-blue);
    font-weight: 600;

    cursor: pointer;
    user-select: none;
}

.filters-bar .chevron {
    margin-right: 5px;
    font-size: 9px;
}

.filters-bar .collapse-mark {
    margin-left: auto;
    color: #6d858e;
}


/* =========================================================
   FILTER PANEL
   ========================================================= */

.filter-panel {
    display: none;

    margin: 0 7px 5px;
    padding: 7px 9px;

    border: 1px solid var(--epic-border);
    border-top: 0;

    background: #f9fbfa;

    gap: 12px;
    align-items: end;
}

.filter-panel.open {
    display: flex;
}

.filter-field {
    display: flex;
    flex-direction: column;

    gap: 2px;
    min-width: 170px;
}

.filter-field label {
    font-weight: 600;
    color: #445b65;
}

.filter-field select {
    height: 24px;

    border: 1px solid #b8c5c2;
    background: #fff;

    font: inherit;
    padding: 0 4px;
}

.clear-btn {
    height: 24px;

    border: 1px solid #b8c5c2;
    background: #f3f5f4;

    font: inherit;
    cursor: pointer;
}


/* =========================================================
   COLUMN HEADERS
   ========================================================= */

.column-header {
    display: grid;

    grid-template-columns:
        2.05fr
        1.08fr
        1.08fr
        1.15fr;

    gap: 8px;

    margin: 0 15px 2px;
    padding: 5px 0 3px;

    font-weight: 700;
    font-size: 10px;
    color: #202020;
}


/* =========================================================
   RESULTS CONTAINER
   ========================================================= */

.results {
    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 0 7px 4px;

    scrollbar-color: #b7ddd5 #eef5f3;
    scrollbar-width: thin;
}


/* =========================================================
   COVERAGE RESULT ROW
   ========================================================= */

.coverage-row {
    display: grid;

    grid-template-columns:
        2.05fr
        1.08fr
        1.08fr
        1.15fr;

    gap: 8px;
    align-items: center;

    min-height: 52px;

    margin-bottom: 3px;
    padding: 5px 12px;

    background: var(--epic-row);

    border: 1px solid #cbd5d2;
    border-radius: 3px;

    cursor: pointer;
}

.coverage-row:hover {
    background: #f3faf8;
    border-color: #9fbfb8;
}

.coverage-row.selected {
    background: var(--epic-selected);
    border-color: #68aa9e;

    box-shadow:
        inset 3px 0 0 var(--epic-teal);
}


/* =========================================================
   PLAN / COVERAGE TEXT
   ========================================================= */

.plan-cell {
    min-width: 0;
}

.plan-name {
    font-size: 16px;
    font-weight: 700;
    color: #171717;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.plan-address {
    margin-top: 2px;

    font-size: 10px;
    color: #343434;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.data-cell {
    font-size: 10px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   EMPTY RESULTS
   ========================================================= */

.empty-state {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    color: #60777f;
    text-align: center;
}


/* =========================================================
   STATUS LINE
   ========================================================= */

.status-line {
    height: 22px;

    display: flex;
    align-items: center;

    padding: 0 9px;

    border-top: 1px solid var(--epic-border);
    background: #edf3f1;

    color: #526970;
    font-size: 9px;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    height: 40px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 6px;
    padding: 4px 8px;

    border-top: 1px solid #bfcac7;
    background: #e8efed;
}

.footer-btn {
    height: 34px;
    min-width: 88px;
    padding: 0 12px;
    border: 1px solid #b8c3c0;
    background: #f5f5f5;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
}

.footer-btn:disabled {
    opacity: 0.48;
    cursor: default;
}

.accept {
    color: #26744d;
}

.cancel {
    color: #8b3832;
}


/* =========================================================
   SEARCH HIGHLIGHT
   ========================================================= */

.highlight {
    background: #fff4a8;
}


/* =========================================================
   RESPONSIVE LAYOUT
   ========================================================= */

@media (max-width: 700px) {

    .top-tools {
        flex-wrap: wrap;
        height: auto;
    }

    .search-wrap {
        width: 100%;
        order: 2;
    }

    .column-header,
    .coverage-row {
        grid-template-columns:
            2fr
            1fr
            1fr;
    }

    .column-header > :last-child,
    .coverage-row > :last-child {
        display: none;
    }

    .filter-panel.open {
        flex-wrap: wrap;
    }
}
}
</style>
</head>
<body>
<div class="plan-window">

</div>

let selectedCoverage = null;
let expandedRows = false;
const byId = id => document.getElementById(id);
const safe = value => String(value ?? '');
const escapeHtml = value => safe(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const uniqueSorted = values => [...new Set(values.map(safe).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

function fillSelect(id, values){
  const select = byId(id);
  uniqueSorted(values).forEach(value => {
    const option = document.createElement('option'); option.value = value; option.textContent = value; select.appendChild(option);
  });
}
fillSelect('productFilter', coverageData.map(x=>x.productType));
fillSelect('financialFilter', coverageData.map(x=>x.financialClass));

function matches(item){
  const term = byId('searchBox').value.trim().toLowerCase();
  const product = byId('productFilter').value;
  const financial = byId('financialFilter').value;
  if(product && safe(item.productType) !== product) return false;
  if(financial && safe(item.financialClass) !== financial) return false;
  if(!term) return true;
  const blob = [item.name,item.id,item.address,item.productType,item.financialClass,...(Array.isArray(item.synonyms)?item.synonyms:[])].map(safe).join(' ').toLowerCase();
  return blob.includes(term);
}
function render(){
  const results = coverageData.filter(matches);
  const container = byId('resultsContainer');
  container.innerHTML = '';
  if(!results.length){
    container.innerHTML = '<div class="empty-state">No plans match the current search and filters.</div>';
  } else {
    results.forEach(item => {
      const row = document.createElement('div');
      row.className = 'coverage-row' + (selectedCoverage && safe(selectedCoverage.id) === safe(item.id) ? ' selected' : '');
      row.tabIndex = 0;
      row.innerHTML = `<div class="plan-cell"><div class="plan-name">${escapeHtml(item.name)} [${escapeHtml(item.id)}]</div><div class="plan-address">${escapeHtml(item.address || '—')}</div></div><div class="data-cell" title="${escapeHtml(item.productType)}">${escapeHtml(item.productType || '—')}</div><div class="data-cell" title="${escapeHtml(item.financialClass)}">${escapeHtml(item.financialClass || '—')}</div><div class="data-cell" title="${escapeHtml((item.synonyms||[]).join(', '))}">${escapeHtml((item.synonyms||[]).join(', ') || '—')}</div>`;
      if(expandedRows){ row.style.minHeight='66px'; row.querySelectorAll('.plan-address,.data-cell').forEach(el=>{el.style.whiteSpace='normal';}); }
      const choose = () => { selectedCoverage = item; byId('acceptBtn').disabled = false; render(); };
      row.addEventListener('click', choose);
      row.addEventListener('keydown', e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
      container.appendChild(row);
    });
  }
  const filtered = byId('searchBox').value.trim() || byId('productFilter').value || byId('financialFilter').value;
  byId('statusLine').textContent = filtered ? `${results.length} of ${coverageData.length} plans shown` : `All ${coverageData.length} plans loaded`;
}
function toggleFilters(force){
  const panel = byId('filterPanel');
  const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open); byId('filtersBar').setAttribute('aria-expanded', String(open));
  byId('filtersBar').querySelector('.collapse-mark').textContent = open ? '⌃' : '⌄';
}
byId('filtersBar').addEventListener('click',()=>toggleFilters());
byId('filtersBar').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFilters();}});
byId('searchBox').addEventListener('input',render);
byId('productFilter').addEventListener('change',render);
byId('financialFilter').addEventListener('change',render);
byId('clearFilters').addEventListener('click',()=>{byId('searchBox').value='';byId('productFilter').value='';byId('financialFilter').value='';selectedCoverage=null;byId('acceptBtn').disabled=true;render();});
byId('expandAll').addEventListener('click',()=>{expandedRows=true;render();});
byId('collapseAll').addEventListener('click',()=>{expandedRows=false;render();});
byId('acceptBtn').addEventListener('click',()=>{
  if(!selectedCoverage) return;
  try{
    const player = parent.GetPlayer();
    player.SetVar('CoverageID', safe(selectedCoverage.id));
    player.SetVar('CoverageName', safe(selectedCoverage.name));
    player.SetVar('CoverageAccepted', true);
	player.SetVar('CoverageVerified', true);
  }catch(error){ console.info('Selected coverage:', selectedCoverage); }
});
byId('cancelBtn').addEventListener('click',()=>{
  selectedCoverage=null; byId('acceptBtn').disabled=true; render();
  try{ parent.GetPlayer().SetVar('CoverageAccepted', false); }catch(error){}
});
render();
</script>
