<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Coverage Search</title>
      <style>
      body{
    font-family:Segoe UI,Tahoma,sans-serif;
    background:#dfe7e5;
    margin:0;
    padding:0;
    color:#333;
    font-size:12px;
}

.coverage-window{
    width:800px;
    height:450px;
    background:#eef4f2;
    border:1px solid #148474;
    display:flex;
    flex-direction:column;
    margin:0 auto;
}

.titlebar{
    height:32px;
    background:#eeeeee;
    border-bottom:1px solid #c8d2cf;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    font-size:14px;
    color:#13766f;
    font-weight:500;
}

.search-section{
    padding:6px 14px;
}

.search-section h2{
    color:#13766f;
    font-size:14px;
    font-weight:600;
    margin:0 0 6px 0;
    border-bottom:1px solid #bcc9c6;
    padding-bottom:4px;
}

.search-modes{
    margin-bottom:6px;
}

.search-modes label{
    margin-right:14px;
    font-size:12px;
}

.search-row{
    display:flex;
    align-items:center;
    gap:0;
}

.search-row input{
    height:22px;
    border:1px solid #7aa7d8;
    box-shadow:0 0 3px rgba(90,140,210,.5);
    font-size:12px;
    padding:0 6px;
    flex:1;
}

.search-row input::placeholder{
    color:#8a97a3;
    font-style:normal;
}

#searchBtn{
    width:26px;
    height:24px;
    border:1px solid #b5bfbc;
    background:#edf1f0;
    cursor:pointer;
}

.search-hint{
    color:#13766f;
    font-size:11px;
    font-weight:600;
    margin:4px 0 0 2px;
}

.help-block{
    margin:8px 14px 0;
}

.help-block .help-title{
    color:#355668;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:5px;
}

.help-block .help-body{
    color:#667;
    font-size:11px;
    margin:3px 0 0 18px;
}

.filters{
    margin:5px 14px 8px;
    background:white;
    border:1px solid #c7d1cf;
    height:30px;
    display:flex;
    align-items:center;
    padding:0 12px;
    font-size:12px;
    font-weight:600;
    color:#355668;
}

.column-header{
    display:grid;
    grid-template-columns:2.2fr 1fr 1fr 1fr;
    font-size:12px;
    font-weight:700;
    padding:0 18px 5px;
    border-bottom:1px solid #c2cbc9;
}

.results{
    overflow-y:auto;
    flex:1;
    padding:0 8px;
}

.empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#13766f;
    padding:14px;
}

.empty-state svg{
    width:70px;
    height:70px;
    opacity:.5;
    margin-bottom:12px;
}

.empty-state .empty-msg{
    font-size:13px;
    max-width:460px;
}

.coverage-card{
    background:#f7f7f7;
    border:1px solid #cbd3d1;
    border-radius:4px;
    margin-bottom:4px;
    box-shadow:none;
}

.coverage-card.selected{
    background:#b6dfd5;
    border-color:#78bdb0;
}

.coverage-grid{
    display:grid;
    grid-template-columns:2.2fr 1fr 1fr 1fr;
    padding:6px 12px;
    align-items:start;
}

.payer-name{
    color:#13766f;
    font-size:12px;
    font-weight:700;
    margin-bottom:2px;
}

.plan-section{
    padding:4px 12px 6px;
    border-top:1px solid #cfd7d5;
}

.plan-section::before{
    content:"Relevant Plans";
    display:block;
    color:#13766f;
    margin-bottom:4px;
    font-size:11px;
}

.plan-pill{
    display:inline-block;
    background:#dde8e5;
    border:1px solid #b7c3bf;
    border-radius:16px;
    padding:2px 10px;
    margin-right:4px;
    margin-bottom:3px;
    font-size:11px;
}

.scan-btn{
    height:24px;
    margin-left:8px;
    border:1px solid #b7c2c0;
    background:#f5f5f5;
    padding:0 8px;
    cursor:pointer;
    font-size:11px;
}

.info-icon{
    margin-left:8px;
    color:#667;
    font-size:13px;
}

.footer-bar{
    height:40px;
    border-top:1px solid #c7d1cf;
    background:#dfe7e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
}

.footer-right{
    display:flex;
    gap:8px;
}

.footer-btn{
    height:26px;
    min-width:90px;
    border:1px solid #b9c3c1;
    background:#f4f4f4;
    color:#444;
    font-size:12px;
    cursor:pointer;
}

.footer-btn:hover{
    background:#fafafa;
}

.footer-btn.accept{
    color:#1f7a40;
    font-weight:600;
}

.footer-btn.cancel{
    color:#b13a32;
    font-weight:600;
}

.footer-btn.secondary{
    min-width:160px;
}

.footer-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}
    </style>
</head>

    <div class="footer-right">

				&#10003; Accept

    </div>

</div>

        const EMPTY_STATE_HTML = `
            <div class="empty-state">
                <svg viewBox="0 0 64 64" fill="none"
                     stroke="#5b6472" stroke-width="3"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6v10a10 10 0 0 0 20 0V6"/>
                    <path d="M14 6h8M34 6h8"/>
                    <path d="M28 26v8a14 14 0 0 0 28 0v-4"/>
                    <circle cx="56" cy="26" r="5"/>
                </svg>
                <div class="empty-msg">
                    There are no available existing coverages to add.
                    Scan barcode, swipe card, or search for a new plan.
                </div>
            </div>
        `;

        function renderCards(data) {

            const container = document.getElementById('resultsContainer');
            const columnHeader = document.getElementById('columnHeader');

            container.innerHTML = '';

            if (!data || data.length === 0) {
                columnHeader.style.display = 'none';
                container.innerHTML = EMPTY_STATE_HTML;
                return;
            }

            columnHeader.style.display = 'grid';

            data.forEach(item => {

                const card = document.createElement('div');
                card.className = 'coverage-card';

                card.innerHTML = `
                    <div class="coverage-grid">
                        <div>
							<div class="payer-name">
								${item.payerName} [${item.payerId}]⚡
							</div>

							<div style="font-weight:bold;">
								${item.planName} [${item.planNumber}]
							</div>

							<div>${item.address || '&mdash;'}</div>
                        </div>
                        <div>${item.productType || '&mdash;'}</div>
                        <div>${item.financialClass || '&mdash;'}</div>
                        <div>${item.synonyms?.join(', ') || '&mdash;'}</div>
                    </div>
                `;

                if (item.plans) {

                    const planSection = document.createElement('div');
                    planSection.className = 'plan-section';
                    planSection.innerHTML =
                        item.plans
                            .map(plan => `<span class="plan-pill">${plan}</span>`)
                            .join('');
                    card.appendChild(planSection);
                }

                card.onclick = () => {
                    document.querySelectorAll('.coverage-card')
                        .forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    window.selectedCoverage = item;
					document.getElementById('acceptBtn').disabled = false;
                };

                container.appendChild(card);
            });
        }

function searchCoverages(term) {

    term = term.toLowerCase().trim();

    const searchMode =
        document.querySelector('input[name="searchType"]:checked').value;

    if (!term) {
        document.getElementById('acceptBtn').disabled = true;
        renderCards([]);
        return;
    }

    const results = coverageData
        .map(item => {

            let score = 0;

            const payerName = (item.name || '').toLowerCase();
            const payerId   = (item.id || '').toLowerCase();
            const address   = (item.address || '').toLowerCase();
            const synonyms  = (item.synonyms || []).map(x => x.toLowerCase());
				const plans = [
					item.planName || '',
					item.planNumber || ''
				].map(x => x.toLowerCase());

            const blob = [
                item.name,
                item.id,
                ...(item.synonyms || []),
                ...(item.plans || [])
            ].join(' ').toLowerCase();

            if (searchMode === 'plan') {

                if (payerId === term) score += 1000;
                if (payerId.includes(term)) score += 500;
                if (payerName === term) score += 800;
                if (payerName.startsWith(term)) score += 400;
                if (payerName.includes(term)) score += 200;
                if (plans.some(x => x === term)) score += 300;
                if (plans.some(x => x.includes(term))) score += 150;

            } else {

                if (payerId === term) score += 1000;
                if (payerName === term) score += 500;
                if (payerName.startsWith(term)) score += 250;
                if (payerName.includes(term)) score += 100;
                if (synonyms.some(x => x === term)) score += 175;
                if (synonyms.some(x => x.includes(term))) score += 100;
                if (plans.some(x => x === term)) score += 150;
                if (plans.some(x => x.includes(term))) score += 75;
                if (address.includes(term)) score += 25;
            }

            if (blob.includes(term)) score += 10;

            return { ...item, score };

        })
        .filter(item => item.score > 0)
        .sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.name.localeCompare(b.name);
        });

    renderCards(results);
}

        // Start blank -> shows empty state
        searchCoverages('');

		document.getElementById('searchBtn').addEventListener('click', () => {
    searchCoverages(document.getElementById('searchBox').value);
});

document.getElementById('searchBox').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        searchCoverages(document.getElementById('searchBox').value);
    }
});

document.getElementById('searchBox').addEventListener('input', e => {
    searchCoverages(e.target.value);
});

document.querySelectorAll('input[name="searchType"]').forEach(radio => {
    radio.addEventListener('change', () => {
        searchCoverages(document.getElementById('searchBox').value);
    });
});
